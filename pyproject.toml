[project]
name = "mcp-calculadora-rtc"
version = "0.2.0"
description = "MCP server para a Calculadora de Tributos RTC (CBS, IBS e Imposto Seletivo - LC 214/2025)."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mcp-calculadora-rtc = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "registro"]
